<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fazeel Nizam | Portfolio</title>
  <script>
    // GitHub Pages SPA redirect: sends all 404 paths back to index.html
    var pathSegmentsToKeep = 1; // /portfolio
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  <h1>Fazeel Nizam – Computer Engineering Portfolio</h1>
  <p>Redirecting to the portfolio...</p>
</body>
</html>
